# Runs SonarQube Cloud analysis on pushes to main and on pull requests only when enabled.
# Before enabling it, onboard the repository to SonarQube Cloud, grant it access to
# SONAR_TOKEN, and set the SONARQUBE_ANALYSIS_ENABLED repository variable to true.

name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    if: vars.SONARQUBE_ANALYSIS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full clone — SonarQube needs git history for accurate new-code detection.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Run the analysis after the repository has a matching SonarQube Cloud project.
      # The project key is derived from the GitHub owner and repository name.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
